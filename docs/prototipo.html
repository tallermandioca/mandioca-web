<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller Mandioca — prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE4; --card:#FFFFFF; --ink:#161412; --ink2:#4A443D; --mute:#6B645C; --line:#D9D2C5; --line2:#EEE8DC;
  --red:#C4302B; --red-d:#9E2A24; --red-bg:#FBE9E8; --red-line:#E3A8A5;
  --ok:#3E8E53; --ok-t:#2E6B3F; --ok-bg:#E2F0E5; --warn:#D98A2B; --warn-t:#8A4B10; --warn-bg:#FBEEDC; --info-t:#2E5E8C; --info-bg:#E4ECF4;
  --photo:#2A2622; --photo2:#3A3430; --photo-t:#C9C0B2; --dark:#161412; --dark-t:#F3EEE4; --dark-line:#3A3430;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1B1916; --card:#242019; --ink:#F3EEE4; --ink2:#D8D0C2; --mute:#A79E90; --line:#3A3430; --line2:#2E2A25;
  --red-bg:#3A1D1C; --red-line:#6B2B28; --ok-bg:#1F3324; --warn-bg:#3A2A14; --info-bg:#1D2A38; --ok-t:#8FD09E; --warn-t:#F2B872; --info-t:#9BC3EA;
}}
:root[data-theme="dark"]{
  --paper:#1B1916; --card:#242019; --ink:#F3EEE4; --ink2:#D8D0C2; --mute:#A79E90; --line:#3A3430; --line2:#2E2A25;
  --red-bg:#3A1D1C; --red-line:#6B2B28; --ok-bg:#1F3324; --warn-bg:#3A2A14; --info-bg:#1D2A38; --ok-t:#8FD09E; --warn-t:#F2B872; --info-t:#9BC3EA;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:'Barlow',system-ui,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit}
button{font:inherit; color:inherit}
.app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--paper)}
@media (min-width:520px){ body{background:#E6E0D4} .app{box-shadow:0 0 0 1px var(--line); min-height:100vh} }

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--dark); color:var(--dark-t); padding:10px 14px; display:flex; align-items:center; gap:10px}
.top img{width:40px;height:40px;border-radius:50%;display:block;background:#fff}
.top .name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; text-transform:uppercase; line-height:1}
.top .sub{font-size:12px; color:#C9C0B2}
.seg{margin-left:auto; display:flex; border:1px solid #4A443D; border-radius:4px; overflow:hidden}
.seg button{background:transparent; border:0; padding:8px 10px; min-height:40px; font-size:13px; font-weight:600; color:#C9C0B2; cursor:pointer}
.seg button.on{background:var(--red); color:#fff}

/* layout */
main{flex:1; padding:16px 18px 24px; display:flex; flex-direction:column; gap:14px}
.h1{margin:0; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:38px; line-height:.95; text-transform:uppercase}
.h2{margin:4px 0 0; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:.04em}
.h3{margin:0; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; line-height:1.1}
.lead{margin:0; color:var(--ink2); font-size:16px}
.mute{color:var(--mute); font-size:13px}
.kicker{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--red)}
.card{background:var(--card); border:1px solid var(--line); border-radius:6px}
.row{display:flex; align-items:center; gap:12px}
.col{display:flex; flex-direction:column; gap:4px; min-width:0; flex:1}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 18px; border-radius:6px; border:0; font-weight:700; font-size:16px; text-decoration:none; cursor:pointer; background:var(--red); color:#fff}
.btn.dark{background:var(--ink); color:var(--paper)}
.btn.ghost{background:transparent; border:2px solid var(--ink); color:var(--ink)}
.btn.sm{min-height:40px; padding:8px 14px; font-size:14px}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red); outline-offset:2px}
.photo{background:var(--photo); color:var(--photo-t); display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; padding:8px; border-radius:4px}
.photo.alt{background:var(--photo2)}
.split{display:flex; height:150px; border-radius:6px 6px 0 0; overflow:hidden}
.split .photo{flex:1; border-radius:0}
.tag{align-self:flex-start; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); border:1px solid var(--red); padding:2px 7px; border-radius:3px}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0; padding:9px 14px; min-height:40px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:14px; font-weight:500; cursor:pointer}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.status{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600}
.dot{width:9px;height:9px;border-radius:50%}
.alert{background:var(--red-bg); border:1px solid var(--red-line); border-left:5px solid var(--red); border-radius:4px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; font-size:14px}
.pill{font-size:12px; font-weight:600; padding:4px 8px; border-radius:3px; white-space:nowrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat{padding:10px 12px; display:flex; flex-direction:column}
.stat b{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:26px; line-height:1}
.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mute)}
.field input,.field textarea,.field select{font:inherit; font-size:16px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:4px; padding:10px 12px; min-height:46px; width:100%}
.field textarea{resize:none}
.check{display:flex; align-items:center; gap:12px; padding:12px; min-height:48px}
.check input{width:22px;height:22px;flex-shrink:0; accent-color:var(--red)}
.bar{height:5px;border-radius:3px;flex:1}
.list{display:flex; flex-direction:column; gap:10px}
.item{padding:10px; display:flex; align-items:center; gap:12px; text-decoration:none; cursor:pointer; width:100%; text-align:left}
.item .thumb{width:60px;height:60px;flex-shrink:0; font-size:10px}
.dark-band{background:var(--dark); color:var(--dark-t); border-radius:6px; padding:18px 16px; display:flex; flex-direction:column; gap:10px}
.dark-band .mute{color:#C9C0B2}
.ig{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.ig .photo{aspect-ratio:1; font-size:11px}
.tbl{width:100%; border-collapse:collapse; font-size:14px}
.tbl td{padding:9px 6px; border-bottom:1px solid var(--line2); vertical-align:top}
.tbl td:first-child{white-space:nowrap; color:var(--mute)}
.foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line); display:flex; gap:8px; position:sticky; bottom:0}
.nav{position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px)); z-index:5}
.nav button{background:transparent; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:64px; min-height:48px; justify-content:center; font-size:11px; font-weight:500; color:var(--ink2); cursor:pointer}
.nav button.on{color:var(--red); font-weight:600}
.nav svg{width:22px;height:22px}
.back{background:transparent; border:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:inherit; cursor:pointer; margin-left:-10px}
.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:6px; font-weight:600; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:90vw; text-align:center; z-index:10}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.steps{display:flex; gap:4px}
.intro{background:var(--card); border:1px dashed var(--line); border-radius:6px; padding:10px 12px; font-size:13px; color:var(--mute)}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="card" style="padding:10px 12px; font-size:14px; display:flex; flex-direction:column; gap:6px">
      <div class="row" style="justify-content:space-between"><span>Martín S. · Telecaster · calibración</span><span class="mute">mar.</span></div>
      <div class="row" style="justify-content:space-between"><span>Ana G. · Yamaha FG · cuerdas</span><span class="mute">jue.</span></div>
      <div class="row" style="justify-content:space-between"><span>Lucas D. · Jazz Bass · calibración</span><span class="mute">vie.</span></div>
    </div>
  </main>${nav(NAV_T)}`;
}
function nueva(){
  const insts = ["Jazz Bass MIJ","Telecaster '78","Criolla Fonseca"];
  const tipos = ['Calibración','Refrete','Reparación','Electrónica','Otro'];
  return `<main>
    <div class="row"><button class="back" aria-label="Volver" onclick="go('panel')">${I.back}</button><div><div class="h1" style="font-size:26px">Nueva orden</div><div class="mute">un solo paso · hoy 08/10</div></div></div>
    <button class="btn ghost" style="border-style:dashed" onclick="toast('Abriría la cámara: el QR trae cliente e instrumento')">${I.qr} Escanear QR del instrumento</button>
    <label class="field">O buscar cliente / instrumento<input type="text" value="Martín"></label>
    <div class="card row" style="padding:10px 12px; border-color:var(--ink); border-width:2px"><div style="width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:600">M</div><div class="col"><div style="font-weight:600">Martín Suárez</div><div class="mute">[WHATSAPP] · 3 instrumentos</div></div><span style="width:20px;height:20px;color:var(--ok-t)">${I.check}</span></div>
    <div class="mute">Instrumento</div>
    <div class="chips">${insts.map((n,i)=>`<button class="chip ${S.no.inst===i?'on':''}" onclick="S.no.inst=${i};render()">${n}</button>`).join('')}<button class="chip" style="border-style:dashed" onclick="toast('Alcanza con una foto del número de serie')">+ Nuevo</button></div>
    <div class="mute">Tipo de trabajo (carga la plantilla)</div>
    <div class="chips" style="flex-wrap:wrap">${tipos.map(t=>`<button class="chip ${S.no.tipo===t?'on':''}" style="${S.no.tipo===t?'background:var(--red);border-color:var(--red)':''}" onclick="S.no.tipo='${t}';render()">${t}</button>`).join('')}</div>
    <label class="field">Qué pide el cliente<div style="position:relative"><textarea rows="2">Cambiar puente por uno de alta masa, revisar octavación.</textarea><button class="back" style="position:absolute;right:4px;top:4px;margin:0" aria-label="Dictar" onclick="toast('Dictado por voz')">${I.mic}</button></div></label>
    <div class="mute">Fotos del antes (opcional)</div>
    <div class="row" style="gap:8px"><div class="photo" style="width:64px;height:64px;font-size:10px">[FOTO]</div><button class="btn ghost sm" style="width:64px;height:64px;border-style:dashed;flex-direction:column;font-size:10px;padding:4px;border-width:1px" onclick="toast('Abriría la cámara')">${I.cam}Sacar foto</button></div>
  </main>
  <div class="foot" style="flex-direction:column;gap:6px"><button class="btn" onclick="crearOrden()">Crear orden y avisar al cliente</button><div class="mute" style="text-align:center">Le llega por WhatsApp el n° de orden y el link a su cuenta</div></div>`;
}
function crearOrden(){
  const id = String(S.nextId++);
  const insts = ["Jazz Bass MIJ","Telecaster '78","Criolla Fonseca"];
  ORDERS.unshift({ id, t:`${insts[S.no.inst]} · ${S.no.tipo.toLowerCase()}`, c:'Martín S.', when:'ingresó hoy', st:'pres' });
  go('panel'); toast(`Orden #${id} creada · aviso enviado a Martín`);
}
function cerrar(){
  const o = ORDERS.find(x=>x.id===S.order) || ORDERS[0];
  return `<main>
    <div class="row"><button class="back" aria-label="Volver" onclick="go('panel')">${I.back}</button><div><div class="h1" style="font-size:26px">Cerrar trabajo</div><div class="mute">#${o.id} · ${o.t} · ${o.c}</div></div></div>
    <div class="card row" style="padding:10px 12px"><span class="tag">Reparación</span><span class="mute">plantilla cargada · tocá lo que cambia</span></div>
    <label class="field">Qué se hizo<div style="position:relative"><textarea rows="3">Puente reemplazado por uno de alta masa. Octavación y action ajustados (2.0 / 2.4 mm). Limpieza de trastes.</textarea><button class="back" style="position:absolute;right:4px;top:4px;margin:0" aria-label="Dictar" onclick="toast('Dictado por voz')">${I.mic}</button></div></label>
    <div class="row"><label class="field" style="flex:1">Importe<input type="text" placeholder="$ (opcional)"></label><label class="field" style="flex:1">Cuerdas puestas<input type="text" value="045–105"></label></div>
    <div class="card row" style="padding:12px"><div class="col"><div class="mute" style="font-size:12px">Próxima revisión</div><div style="font-weight:600">En 6 meses · 08/04/2027</div></div><button class="btn sm ghost" style="border:0;color:var(--red)" onclick="toast('Elegirías otro plazo')">Cambiar</button></div>
    <div class="mute">Foto del después</div>
    <div class="row" style="gap:8px"><div class="photo" style="width:64px;height:64px;font-size:10px">[FOTO]</div><button class="btn ghost sm" style="width:64px;height:64px;border-style:dashed;flex-direction:column;font-size:10px;padding:4px;border-width:1px" onclick="toast('Abriría la cámara')">${I.cam}Sacar foto</button></div>
    <label class="card check"><input type="checkbox" checked><div class="col"><span style="font-weight:600">Mostrar en Trabajos</span><span class="mute">usa las fotos de antes y después, sin datos del cliente</span></div></label>
    <label class="card check"><input type="checkbox" checked><div class="col"><span style="font-weight:600">Avisar al cliente</span><span class="mute">"Tu ${o.t.split(' ·')[0]} está listo para retirar" por WhatsApp</span></div></label>
  </main>
  <div class="foot"><button class="btn ghost" style="flex:1" onclick="go('panel');toast('Borrador guardado')">Guardar borrador</button><button class="btn" style="flex:2" onclick="cerrarOrden('${o.id}')">Cerrar trabajo</button></div>`;
}
function cerrarOrden(id){
  const o = ORDERS.find(x=>x.id===id); if(o) o.st='done';
  go('panel'); toast(`#${id} cerrada · cliente avisado · publicado en Trabajos`);
}
function simple(title, body){ return `<main><h1 class="h1" style="font-size:30px">${title}</h1>${body}</main>${nav(NAV_T)}`; }
function clientes(){
  return simple('Clientes', `<label class="field">Buscar<input type="text" placeholder="Nombre, instrumento o n° de serie"></label><div class="list">${[['Martín Suárez','3 instrumentos · última visita 02/10'],['Lucía Paredes','1 instrumento · orden abierta'],['Jorge Ríos','2 instrumentos · para retirar'],['Sofía Molina','1 instrumento · presupuesto pendiente'],['Ana García','1 instrumento · aviso jueves']].map(([n,d])=>`<button class="card item" onclick="toast('Abriría la ficha de ${n}')"><div style="width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:600">${n[0]}</div><div class="col"><div style="font-weight:600">${n}</div><div class="mute">${d}</div></div>${I.chev}</button>`).join('')}</div>`);
}
function avisos(){
  return simple('Avisos', `<p class="lead">Se mandan solos por WhatsApp cuando vence la revisión. Podés pausar cualquiera.</p><div class="list">${[['Martín S. · Telecaster','Calibración vencida 15/09','mar. 13/10','var(--red-d)'],['Ana G. · Yamaha FG','Cambio de cuerdas','jue. 15/10','var(--warn-t)'],['Lucas D. · Jazz Bass','Calibración','vie. 16/10','var(--warn-t)'],['Jorge R. · Criolla','Calibración','03/11','var(--mute)']].map(([n,d,w,c])=>`<div class="card row" style="padding:12px"><div class="col"><div style="font-weight:600">${n}</div><div class="mute">${d}</div></div><div style="text-align:right"><div style="font-weight:600;color:${c};font-size:13px">${w}</div><button class="btn sm ghost" style="border:0;min-height:32px;padding:4px 8px;font-size:13px;color:var(--mute)" onclick="toast('Aviso pausado')">Pausar</button></div></div>`).join('')}</div>`);
}

const VIEWS = { home, trabajos, venta, cuenta, ficha, panel, nueva, cerrar, clientes, avisos };
function render(){ document.getElementById('app').innerHTML = topBar() + (VIEWS[S.screen]||home)(); }
render();
</script>
</body>
</html>
